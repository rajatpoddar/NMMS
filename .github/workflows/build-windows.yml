# ============================================
# NMMS Tracker - Windows Installer Builder
# ============================================
# Builds a standalone Windows .exe of the
# desktop GUI app using PyInstaller.
# ============================================
name: Build Windows Installer

on:
  push:
    branches: [main, master]
    paths:
      - "app.py"
      - "requirements-client.txt"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Chrome (required by Selenium)
        shell: pwsh
        run: |
          $chrome = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue
          if ($chrome) {
            Write-Host "Chrome found: $($chrome.'(default)')"
          } else {
            Write-Host "Chrome not found in registry"
            chrome --version 2>$null | ForEach-Object { Write-Host $_ }
          }

      - name: Install desktop client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-client.txt
          pip install pyinstaller>=6.10

      - name: Verify imports
        run: |
          python -c "
          print('Checking imports...')
          import customtkinter; print('✓ customtkinter')
          import requests; print('✓ requests')
          from bs4 import BeautifulSoup; print('✓ bs4')
          from selenium import webdriver; print('✓ selenium')
          from selenium.webdriver.chrome.service import Service; print('✓ selenium.webdriver.chrome.service')
          from selenium.webdriver.chrome.options import Options; print('✓ selenium.webdriver.chrome.options')
          from selenium.webdriver.common.by import By; print('✓ selenium.webdriver.common.by')
          from selenium.webdriver.support.ui import WebDriverWait, Select; print('✓ selenium.webdriver.support.ui')
          from selenium.webdriver.support import expected_conditions as EC; print('✓ selenium.webdriver.support.expected_conditions')
          from webdriver_manager.chrome import ChromeDriverManager; print('✓ webdriver_manager.chrome')
          import pandas as pd; print('✓ pandas')
          from openpyxl import Workbook; print('✓ openpyxl')
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side; print('✓ openpyxl.styles')
          from openpyxl.drawing.image import Image as OpenpyxlImage; print('✓ openpyxl.drawing.image')
          from io import BytesIO; print('✓ io.BytesIO')
          from PIL import Image as PILImage; print('✓ PIL.Image')
          import getmac; print('✓ getmac')
          print('All imports successful!')
          "

      - name: Build executable with PyInstaller
        run: |
          pyinstaller ^
            --onefile ^
            --windowed ^
            --name "NMMS_Tracker" ^
            --hidden-import "customtkinter" ^
            --hidden-import "PIL._tkinter_finder" ^
            --hidden-import "selenium" ^
            --hidden-import "webdriver_manager" ^
            --hidden-import "webdriver_manager.chrome" ^
            --hidden-import "openpyxl" ^
            --hidden-import "pandas" ^
            --hidden-import "bs4" ^
            --hidden-import "getmac" ^
            --hidden-import "jinja2" ^
            app.py

      - name: List build output
        run: |
          dir dist\
          echo "Build output size:"
          powershell -Command "(Get-Item dist\NMMS_Tracker.exe).Length / 1MB | ForEach-Object { '{0:N2} MB' -f $_ }"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMMS_Tracker_Windows_${{ github.event.inputs.version || 'latest' }}
          path: dist/NMMS_Tracker.exe
          retention-days: 30

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NMMS_Tracker.exe
          generate_release_notes: true
