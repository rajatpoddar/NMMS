# ============================================
# NMMS Tracker - Windows Installer Builder
# ============================================
# Builds a standalone Windows .exe of the
# desktop GUI app using PyInstaller.
# ============================================
name: Build Windows Installer

on:
  push:
    branches: [main, master]
    paths:
      - "app.py"
      - "requirements-client.txt"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Chrome (required by Selenium)
        shell: pwsh
        run: |
          $chrome = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue
          if ($chrome) {
            Write-Host "Chrome found: $($chrome.'(default)')"
          } else {
            Write-Host "Chrome not found in registry"
            chrome --version 2>$null | ForEach-Object { Write-Host $_ }
          }

      - name: Install desktop client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-client.txt
          pip install pyinstaller>=6.10

      - name: Verify imports
        run: |
          python -c "
          import sys
          import io
          sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')
          print('Checking imports...')
          import customtkinter; print('[OK] customtkinter')
          import requests; print('[OK] requests')
          from bs4 import BeautifulSoup; print('[OK] bs4')
          from selenium import webdriver; print('[OK] selenium')
          from selenium.webdriver.chrome.service import Service; print('[OK] selenium.webdriver.chrome.service')
          from selenium.webdriver.chrome.options import Options; print('[OK] selenium.webdriver.chrome.options')
          from selenium.webdriver.common.by import By; print('[OK] selenium.webdriver.common.by')
          from selenium.webdriver.support.ui import WebDriverWait, Select; print('[OK] selenium.webdriver.support.ui')
          from selenium.webdriver.support import expected_conditions as EC; print('[OK] selenium.webdriver.support.expected_conditions')
          from webdriver_manager.chrome import ChromeDriverManager; print('[OK] webdriver_manager.chrome')
          import pandas as pd; print('[OK] pandas')
          from openpyxl import Workbook; print('[OK] openpyxl')
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side; print('[OK] openpyxl.styles')
          from openpyxl.drawing.image import Image as OpenpyxlImage; print('[OK] openpyxl.drawing.image')
          from io import BytesIO; print('[OK] io.BytesIO')
          from PIL import Image as PILImage; print('[OK] PIL.Image')
          import getmac; print('[OK] getmac')
          print('All imports successful!')
          "

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name "NMMS_Tracker" --hidden-import customtkinter --hidden-import PIL._tkinter_finder --hidden-import selenium --hidden-import webdriver_manager --hidden-import webdriver_manager.chrome --hidden-import openpyxl --hidden-import pandas --hidden-import bs4 --hidden-import getmac --hidden-import jinja2 app.py

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem dist\
          if (Test-Path "dist\NMMS_Tracker.exe") {
            $sizeMB = (Get-Item "dist\NMMS_Tracker.exe").Length / 1MB
            Write-Host "Build output size: $([math]::Round($sizeMB, 2)) MB"
          }

      - name: Determine release tag name
        shell: pwsh
        run: |
          # Use manual version if provided, otherwise generate a tag from timestamp + commit SHA
          $manualVer = "${{ github.event.inputs.version }}"
          if ($manualVer -ne "") {
            $tag = $manualVer
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $timestamp = (Get-Date).ToString('yyyyMMdd-HHmmss')
            $tag = "build-$timestamp-$shortSha"
          }
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMMS_Tracker_Windows_${{ github.event.inputs.version || github.sha }}
          path: dist/NMMS_Tracker.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NMMS Tracker ${{ env.RELEASE_TAG }}
          body: |
            Automated build of [NMMS Tracking Report](https://github.com/${{ github.repository }}).

            **Commit:** ${{ github.sha }}
            **Trigger:** ${{ github.event_name }} (${{ github.ref }})
          files: dist/NMMS_Tracker.exe
          generate_release_notes: false
          make_latest: ${{ github.event.inputs.version != '' && 'true' || 'false' }}
